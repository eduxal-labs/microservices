[package]
name = "common"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
default = []
test = ["diesel", "dynamodb"]
diesel = ["dep:diesel"]
dynamodb = ["dep:aws-sdk-dynamodb"]

[dependencies]
bson = "2"
serde = { workspace = true }
serde_json = { workspace = true }
diesel = { version = "2.2", optional = true, features = ["sqlite"] }
aws-sdk-dynamodb = { version = "1.60", optional = true }
thiserror = "2"
chrono = { version = "0.4.45", features = ["serde"] }
rusty_paseto = { version = "0.10.0", features = ["v4", "local", "public"] }
