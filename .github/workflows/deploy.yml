name: CI/CD SAM Deployment

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  id-token: write   # Required for requesting OIDC JWT token
  contents: read    # Required for checking out repository

jobs:
  test:
    name: Build & Test Cargo Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Check
        env:
          PASETO_PASSWORD: ${{ secrets.PASETO_PASSWORD }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        run: cargo check --workspace --all-targets

      - name: Run Cargo Test
        env:
          PASETO_PASSWORD: ${{ secrets.PASETO_PASSWORD }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        run: cargo test --workspace

  deploy:
    name: Deploy to AWS SAM
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig (for cross-compilation)
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-lambda
        run: pip install cargo-lambda

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials (via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Ensure ACM Certificate & Cloudflare Validation
        id: acm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || vars.CLOUDLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
          DOMAIN_NAME: auth.eduxal.com
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: python3 .github/scripts/ensure_acm_and_dns.py

      - name: Build Binaries with Cargo Lambda
        env:
          PASETO_PASSWORD: ${{ secrets.PASETO_PASSWORD }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        run: cargo lambda build --release --arm64

      - name: Run AWS Diagnostics
        run: python3 .github/scripts/diagnose_aws.py

      - name: SAM Deploy
        run: |
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name eduxal-microservices --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NOT_FOUND")
          WAS_DELETED=false
          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ] || [ "$STACK_STATUS" = "ROLLBACK_FAILED" ]; then
            echo "Stack is in $STACK_STATUS state. Deleting failed stack before re-deploying..."
            aws cloudformation delete-stack --stack-name eduxal-microservices
            aws cloudformation wait stack-delete-complete --stack-name eduxal-microservices
            WAS_DELETED=true
          fi

          echo "Purging auth.eduxal.com from API Gateway V1 and V2..."
          aws apigateway delete-domain-name --domain-name auth.eduxal.com 2>/dev/null || true
          aws apigatewayv2 delete-domain-name --domain-name auth.eduxal.com 2>/dev/null || true

          while aws apigateway get-domain-name --domain-name auth.eduxal.com >/dev/null 2>&1 || aws apigatewayv2 get-domain-name --domain-name auth.eduxal.com >/dev/null 2>&1; do
            echo "Waiting for API Gateway domain auth.eduxal.com to release..."
            sleep 5
            WAS_DELETED=true
          done

          if [ "$WAS_DELETED" = true ]; then
            echo "Waiting 60 seconds for API Gateway regional internal domain lock to fully decay..."
            sleep 60
          fi

          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name eduxal-microservices \
            --parameter-overrides CertificateArn="${{ steps.acm.outputs.cert_arn }}" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND

      - name: Sync Cloudflare DNS Automatically
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || vars.CLOUDLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
          DOMAIN_NAME: auth.eduxal.com
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          python3 .github/scripts/sync_cloudflare_dns.py
