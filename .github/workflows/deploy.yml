name: CI/CD SAM Deployment

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  id-token: write   # Required for requesting OIDC JWT token
  contents: read    # Required for checking out repository

jobs:
  test:
    name: Build & Test Cargo Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Check
        env:
          PASETO_PASSWORD: ${{ secrets.PASETO_PASSWORD }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        run: cargo check --workspace --all-targets

      - name: Run Cargo Test
        env:
          PASETO_PASSWORD: ${{ secrets.PASETO_PASSWORD }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        run: cargo test --workspace

  deploy:
    name: Deploy to AWS SAM
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-lambda
        run: pip install cargo-lambda

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials (via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: SAM Build
        env:
          PASETO_PASSWORD: ${{ secrets.PASETO_PASSWORD }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        run: sam build

      - name: SAM Deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name eduxal-microservices \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND

      - name: Sync Cloudflare DNS Automatically
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          DOMAIN_NAME: auth.eduxal.com
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          python3 .github/scripts/sync_cloudflare_dns.py
