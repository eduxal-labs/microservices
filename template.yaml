AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  eduxal
  Multi-service AWS SAM application for Eduxal with ARM architecture, HTTP API Gateway, DynamoDB tables, and SQS Messenger Queue.

Parameters:
  DomainName:
    Type: String
    Default: auth.eduxal.com
    Description: Custom domain name for the HTTP API Gateway

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: provided.al2023
    Architectures:
      - arm64
    Environment:
      Variables:
        RUST_LOG: info

Resources:
  # ============================================================================
  # ACM Certificate for Custom Domain (auth.eduxal.com)
  # ============================================================================
  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS

  # ============================================================================
  # HTTP API Gateway
  # ============================================================================
  EduxalHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: eduxal-http-api
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
        AllowMethods:
          - "*"
      Domain:
        DomainName: !Ref DomainName
        CertificateArn: !Ref ApiCertificate
        EndpointConfiguration: REGIONAL

  # ============================================================================
  # SQS Queue
  # ============================================================================
  MessengerQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: eduxal-messenger-queue
      VisibilityTimeout: 30

  # ============================================================================
  # DynamoDB Tables
  # ============================================================================
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: eduxal-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: phone
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
        - AttributeName: phone
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: PhoneIndex
          KeySchema:
            - AttributeName: phone
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  VerificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: eduxal-verifications
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone
          AttributeType: S
      KeySchema:
        - AttributeName: phone
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: eduxal-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: user
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ============================================================================
  # Lambda Functions
  # ============================================================================
  AuthenticationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: eduxal-authentication
      CodeUri: ./services/authentication
      Handler: bootstrap
      Environment:
        Variables:
          USERS_TABLE_NAME: !Ref UsersTable
          VERIFICATIONS_TABLE_NAME: !Ref VerificationsTable
          SESSIONS_TABLE_NAME: !Ref SessionsTable
          MESSENGER_QUEUE_URL: !Ref MessengerQueue
      Events:
        ApiAuth:
          Type: HttpApi
          Properties:
            ApiId: !Ref EduxalHttpApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VerificationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt MessengerQueue.QueueName
    Metadata:
      BuildMethod: cargo-lambda

  MessengerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: eduxal-messenger
      CodeUri: ./services/messenger
      Handler: bootstrap
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          VERIFICATIONS_TABLE_NAME: !Ref VerificationsTable
      Events:
        MessengerQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt MessengerQueue.Arn
            BatchSize: 80
            MaximumBatchingWindowInSeconds: 1
            ScalingConfig:
              MaximumConcurrency: 1
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VerificationsTable
    Metadata:
      BuildMethod: cargo-lambda

Outputs:
  HttpApiUrl:
    Description: "HTTP API Gateway endpoint URL"
    Value: !Sub "https://${EduxalHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CustomDomainUrl:
    Description: "Custom Domain URL"
    Value: !Sub "https://${DomainName}"
  UsersTableName:
    Description: "Users DynamoDB Table Name"
    Value: !Ref UsersTable
  VerificationsTableName:
    Description: "Verifications DynamoDB Table Name"
    Value: !Ref VerificationsTable
  SessionsTableName:
    Description: "Sessions DynamoDB Table Name"
    Value: !Ref SessionsTable
  MessengerQueueUrl:
    Description: "Messenger SQS Queue URL"
    Value: !Ref MessengerQueue
  MessengerQueueArn:
    Description: "Messenger SQS Queue ARN"
    Value: !GetAtt MessengerQueue.Arn
